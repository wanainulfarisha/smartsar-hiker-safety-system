name: hiking_mobile_app
description: SmartSAR hiker tracking and SOS mobile application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_analytics: ^12.2.0
  cloud_firestore: ^6.2.0

  google_maps_flutter: ^2.6.0
  mobile_scanner: ^7.2.0
  geolocator: ^13.0.1

  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    -  assets/images/offline_map.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  remove_alpha_ios: true
